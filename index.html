<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Cloud AI Cost Auditor</title>
    <!-- Load Stripe Security Framework -->
    <script src="https://stripe.com"></script>
    <style>
        /* Premium Tech Dark Theme Styling */
        body {
            background-color: #121824;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 40px;
        }
        .logo-placeholder {
            width: 60px;
            height: 60px;
            background-color: #1E293B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #3B82F6;
            margin: 0 auto 15px auto;
            border: 2px solid #3B82F6;
        }
        h1 {
            font-size: 32px;
            margin: 0;
            font-weight: 700;
        }
        /* Slate-Gray Dashboard Card Container */
        .dashboard-card {
            background-color: #1E293B;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .file-uploader {
            border: 2px dashed #475569;
            padding: 30px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background-color: #0F172A;
            transition: border-color 0.2s;
        }
        .file-uploader:hover {
            border-color: #3B82F6;
        }
        .file-uploader input {
            display: none;
        }
        /* Sleek Production Action Button */
        .pay-btn {
            background-color: #3B82F6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .pay-btn:hover {
            background-color: #2563EB;
        }
        /* Clean Symmetric Calculation Lines */
        .results-container {
            border-top: 1px solid #334155;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 16px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
        }
        .result-value {
            font-weight: 700;
            color: #10B981; /* Emerald Green */
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-placeholder">F</div>
        <h1>Multi-Cloud AI Cost Auditor</h1>
    </div>

    <!-- Main Dashboard Container -->
    <div class="dashboard-card">
        <label class="file-uploader" id="drop-zone">
            <span id="upload-text">📎 Drag & drop cloud bill file here</span>
            <input type="file" id="file-input" accept=".txt">
        </label>

        <button class="pay-btn" id="checkout-button">Pay \$149 & Scan Cloud Bill</button>

        <div class="results-container">
            <div class="result-row">
                <span>Total Monthly Waste:</span>
                <span class="result-value" id="waste-display">\$0.00</span>
            </div>
            <div class="result-row">
                <span>Our 10% Success Fee:</span>
                <span class="result-value" id="fee-display">\$0.00</span>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
const uploadText = document.getElementById('upload-text');
const checkoutButton = document.getElementById('checkout-button');
const wasteDisplay = document.getElementById('waste-display');
const feeDisplay = document.getElementById('fee-display');

// Show the uploaded file name inside the slot
fileInput.addEventListener('change', (e) => {
    if(e.target.files.length > 0) {
        uploadText.textContent = "📄 " + e.target.files.name;
    }
});

// Run the full payment check and AI data route when clicked
checkoutButton.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) {
        alert("⚠️ Please drag and drop a cloud bill file first!");
        return;
    }

    checkoutButton.textContent = "⏳ Processing Payment & AI Scan...";
    checkoutButton.disabled = true;

    try {
        // Create a data box to safely hold your customer's text file
        const formData = new FormData();
        formData.append('file', file);

        // Send the file straight to your live Python AI server on Render!
        const response = await fetch('https://onrender.com', {





            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.total_waste) {
            // Update your beautiful emerald green screen numbers instantly!
            wasteDisplay.textContent = "$" + data.total_waste;
            feeDisplay.textContent = "$" + data.success_fee;
            checkoutButton.textContent = "✅ Scan Completed Successfully!";
        } else {
            alert("❌ Server Error: " + (data.error || "Failed to process text file."));
            checkoutButton.textContent = "Pay $149 & Scan Cloud Bill";
            checkoutButton.disabled = false;
        }

    } catch (error) {
        console.error("Pipeline breakdown:", error);
        alert("⏳ Connecting to free Render instance... If it's asleep, please click the button again in 30 seconds!");
        checkoutButton.textContent = "Pay $149 & Scan Cloud Bill";
        checkoutButton.disabled = false;
    }
});

    </script>
</body>
</html>
